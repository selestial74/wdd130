<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Janzent G. Caliso">
    <meta name="description"
      content="Contact White Water Rafting for questions, reservations, and rafting information.">


    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>


    <main>

        <section class="contact-info">

            <h1>Contact Us</h1>

            <div class="company-details">

                <h2>Company Information</h2>

                <p><strong>Address:</strong><br>
                    123 River Adventure Road<br>
                    Idaho, USA</p>

                <p><strong>Phone:</strong><br>
                    +1 (208) 555-1234</p>

                <p><strong>Email:</strong><br>
                    info@rapidadventures.com</p>

            </div>

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18..." width="100%"
                  height="300" loading="lazy">
                </iframe>
            </div>

        </section>

        <div class="employees">

            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.png" alt="River Guide Jessica">
                <figcaption>Jessica — Senior River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.png" alt="Safety Instructor John Paul">
                <figcaption>John Paul — Safety Instructor</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.png" alt="Customer Service Jemimah">
                <figcaption>Jemimah — Customer Service Lead</figcaption>
            </figure>

        </div>

        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form action="#" id="contactForm">

                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <fieldset>

                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>

                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label>
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Rapid Adventures Rafting | Janzent G. Caliso
        </p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
